; Development PHP settings.
; why: opcache stays ON to mirror production behaviour, but
; validate_timestamps=1 + revalidate_freq=0 re-checks files on every request
; so edited code is picked up instantly through the bind mount.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

display_errors = On
log_errors = On
