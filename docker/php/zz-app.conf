; Application pool overrides (loaded after www.conf).
[www]
listen = 9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; why: recycling workers guards against slow memory leaks in long-lived pools.
pm.max_requests = 500

; Endpoints used by the container healthcheck and (optionally) monitoring.
ping.path = /ping
pm.status_path = /status

; why: php-fpm strips the environment by default; Laravel needs the variables
; docker-compose injects via env_file.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
