; Production PHP tuning.
; why: validate_timestamps=0 means PHP never stats files after the first
; compile - fastest possible, safe because a prod container's code never
; changes (a deploy replaces the whole image).
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000

realpath_cache_size = 4096K
realpath_cache_ttl = 600

display_errors = Off
log_errors = On
