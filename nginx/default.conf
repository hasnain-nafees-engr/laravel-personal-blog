# nginx in front of php-fpm (service "app" in docker-compose).
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # Matches php.ini post_max_size headroom; uploads are re-validated in PHP.
    client_max_body_size 12m;

    # Compress text responses.
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml application/rss+xml image/svg+xml;

    # why: Livewire serves /livewire/livewire.js through PHP, so it must be
    # matched BEFORE the static-asset regex below (^~ wins over regex).
    location ^~ /livewire {
        try_files $uri /index.php?$query_string;
    }

    # Hashed Vite bundles and uploaded media: cache hard, fall through to 404.
    location ~* \.(?:css|js|mjs|jpg|jpeg|png|webp|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Everything else: file, directory, then the Laravel front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 60s;
    }

    # why: only the front controller may execute; blocks uploaded-file tricks.
    location ~ \.php$ { return 404; }

    # Never serve dotfiles (.env would be catastrophic) except ACME challenges.
    location ~ /\.(?!well-known) { deny all; }
}
